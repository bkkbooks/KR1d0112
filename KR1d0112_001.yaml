body:
  text: 卷上天官冢宰辨方正位辨方免反陸德明釋文引徐邈劉昌宗邦免切別也丁度集韻上聲二十八獮辨字注引劉昌宗胥十有二人胥思敘反釋文引鄭徐劉注胥讀諝思敘反釋文賈八人賈音嫁下放此內饔注割亨煎和之稱亨普孟反亨人亨普庚反並同上酒人奄十人奄於驗反釋文縫人縫扶用反釋文染人染而儉反同上大宰以弊邦治弊府世反釋文引徐劉五曰賦貢注賦口率出泉也率音類釋文引徐劉藪牧養蕃鳥獸牧音茂釋文臣妾聚斂疏材疏音蘇以九賦斂財賄注鄉大夫以歲時鄉音香斿貢注燕好珠璣音其既反及納亨普孟反享先王享音向注享幣同小宰喪荒之聯事注屬其六紖音引並同上斂施之聯事施音弛釋文弛劉本作施以質劑注今時月平音病釋文宰夫辟名者辟芳益反宮正以時比宮中之官府次舍之衆寡注次諸吏直宿息就反下同並同上膳夫飲用六清注水漿醴䣼醫酏書支反釋文商支切粥清也集韻上平聲五支酏字注醬用百有二十罋音瓮屋貢反釋文引徐劉注以五齊七醢七菹三臡實之臡奴兮反釋文膳夫授祭品注謂刌肺脊也刌音忖凡王之稍事注而間食間古莧反並同上庖人共祭祀之好羞注青州之蟹胥音素釋文胥息徐反劉音泰王應麟困學紀聞卷四引劉音素泰蓋素之訛也夏行腒鱐膳膏臊注嘆熱而乾暵呼旦反釋文甸師祭祀共蕭茅注縮浚也浚思順反獸人掌罟田獸注以罔搏所當田之獸也搏音付後同及弊田令禽注于虞中注夏獻禽以享禴享音向後皆放此鱉人以時簎魚鱉龜蜃簎倉伯反臘人膴胖注皆謂夾脊肉夾古協反醫師聚毒藥以共醫事注若藥不瞑胘虎縣反疕瘍者疕芳指反食醫調以滑甘注滫瀡以滑之滫思酒反並同上魚宜苽注苽凋胡也凋音雕釋文雕劉本作凋音雕疾醫參之以九藏之動注岐伯榆柎音附釋文瘍醫掌腫瘍潰瘍金瘍斷瘍之祝藥斷時設反釋文折劉本作斷云云注踠跌者跌徒沒反釋文凡療瘍以五毒攻之注合黃堥音武又音無酒正四曰酏注今之粥音育並同上中祭再二注王服鷩冕毳冕所祭也鷩方利反釋文引徐劉籩人膴鮑魚鱐注切其腴以啖所貴啖徒覽反釋文榛實榛士鄰反醢人酏食注舉糔溲之糔相早反並同上以五齊子西反釋文引徐劉宮人掌王之六寢之修音修釋文掌舍設梐枑注受居溜水洓橐者也洓色遘反釋文引徐劉為壇壝欲鬼反釋文掌次以待張事張音帳玉府共王之服玉佩玉珠玉注蠙珠蠙薄田反掌王之燕衣服注袍襗之屬襗音澤司裘諸侯則共虎侯豹侯注于五十千音鴈皆設其鵠注取名於鳱鵠鳱音鴈內宰后祼獻則贊瑤爵注王既酳尸酳侯吝反出其度量淳制淳諸允反注皆同內小臣掌王之陰事注若今掖音亦並同上九嬪贊王齍音祖稽反釋文箋西切受黍稷器集韻上平聲十二齊齍字注典絲共其絲纊組文之物注以給線縷著旴口綦握之屬纊古曠反綦音其握烏豆反釋文典枲掌布緦縷紵之麻草之物注葛檾之屬檾枯熒反內司服揄狄注玼兮玼兮玼倉我反注夫人服稅衣揄狄稅吐亂反素沙注今之白縛也縛音絹縫人衣翣柳之材注故書翣柳作接柳上所甲反下音柳並同上染人春暴練暴步落反釋文白各切日乾也集韻入聲十九鐸暴字注夏纁玄注始湛研之湛慈鴆反釋文秋染夏注曰𠷎曰災曰希𠷎音壽希張履反追師為副編次第注所為髲髢音地注卷髮者卷羌權反屨人青句注絇謂之拘音句夏采以冕服復于大祖注升自東榮音營並同上地官司徒媒人媒音梅釋文土訓音訓草人注草之言礦也礦侯猛反並同上掌茶注茅莠音酉詩釋文舂人奄二人奄於驗反釋文大司徒宜物音鱗釋文鱗劉本作挍宋本注疏音義作據正宜膏物注膏當為櫜古到反釋文其民豐肉而庳肉而樹反以其室數制之注謂制丘甸之屬甸常證反奠地守奠音定使之相賙子喻反小司徒大喪帥邦役注喪役正棺引窆復土窆補鄧反復音福共茅蒩注既祭藏其隋相恚反執纛音毒注匠人執翿音桃並同上族師以相葬埋葬才郎反釋文慈郎切瘞也集韻下平聲十一唐葬字注鼓人以路鼓鼓鬼享虛讓反釋文兵舞帗舞者帗音弗夜鼓鼜注旦明五通為發昫休武反牛人以授職人職之式反注樴謂之杙餘則反共其牛牲之互與其盆簝互音護簝魯討反載師有里布注掌斂市之次布儳布儳音讒遺人遺音遂十里有廬注若今野候徙有庌也庌音雅司救音拘媒氏聽之于勝國之社注而棧其下棧才産反司市以量度成賈而徵儥音育以賈民禁僞而除詐賈音嫁以泉府同貨而斂賖注則賖貰而豫之貰傷夜反其附于刑者注故書附為柎方符反罰一幕音莫質人一其淳制淳反純反廛人總布總依杜音儳並同上凡珍異之有滯者注謂貨物貯葬於市中葬如字釋文藏如字劉本作葬音同所以紓民事紓常汝反釋文遂人五縣為遂注追胥起徒役追張類反釋文以時器勸氓注錢鎛之屬錢音踐溝上有畛音真帥六遂之役而致之注給墓上事及竁也竁昌絹反穿也遂師庀其委積庀副美反及窆抱磨音歷草人疆㯺用蕡㯺音攬稻人以列舍水注田之畦㽟也畦音圭又下圭反並同上以澮寫水寫殤故反釋文傷故切行水也集韻去聲十一暮寫字注士訓以詔地事注幽并地宜麋音紀倫反釋文麻劉沈皆作麋音云云草人草侯猛反釋文掌金玉錫石之地注錫鈏也鈏常忍反羽人百羽為摶徒端反注百羽謂之緷音渾十搏為縛古本反掌染草注茅搜橐盧豕首紫茢之屬茅音妹茢閭計反掌荼徵野疏材之物注荼茅莠音酉掌蜃祭祀共蜃器之蜃注可以白器白薄霸反場人享亦如之凡享皆音向後倣此廩人則共其接盛注接讀為一扱再祭之扱初輒反並同上春官宗伯乃立春官宗伯注氏姓之所出氏立紙釋文守祧奄八人奄於驗反同上大師注晉杜蒯杜音屠下苦怪反釋文杜通作屠同都切集韻上平聲十一模杜字注瞽矇注無目眹謂之瞽眹音睫釋文𩎟師𩎟音妹釋文引劉李注杜子春讀𩎟為菋荎著之菋荎直梨反釋文馮相氏注宿離不貸宿息就反同上巾車巾居覲反釋文居焮切衣也集韻去聲二十四炘巾字注大宗伯以貍沈祭山林川澤貍莫拜反釋文瘞也集韻去聲十六怪貍字注沈直蔭反釋文以禬禮哀圍敗禬戶外反釋文以地産作陽德注楚性急悍音旱兆五帝於四郊注蒼曰靈威仰五郎反黑曰汁光紀汁子集反小宗伯毛六牲毛莫報反省鑊注視亨腥熟享普孟反而立軍社注軍行祓社祓音廢而饁獸于郊饁于法反甫竁注聲如腐脆之脆清劣反肆師及其祈珥注門夾室夾古協反類造上帝注奠於牧室牧音茂鬱人和鬱鬯注以煮之鐎中鐎似消反鬯人凡祭祀壇壝欲鬼反司尊彝蜼彝注蜼禺屬禺音隅司几筵紛純之閏反其柏席柏依司農音迫每敦一几敦音疇凶事仍几注翌日翌音育天府凡國之玉鎮大寶器藏焉注垂之竹矢垂音瑞典瑞圭璧以祀日月星辰注取殺於上帝殺色例反封國則以土地注以求地中丁仲反珍圭以徵守守又反注徵守同司服則鷩冕鷩府弊反則毳冕毳清歲反則希冕希豬履反注下皆同則玄冕注裳則黻而巳剌七賜反凡兵事韋辨服注以𩎟韋為辨𩎟音妹又莫拜反大札大荒大災素服注縞冠縞剛操反守祧則藏其隋與服隋相恚反世婦比其具比芳美反冢人以昭穆為左右注夾處東西夾古協反及葬言鷩車象人注巾車所飾遺車也巾居覲反大司樂興道諷誦言語興道虛甑反注同下音導注言古以剴今也剴古哀反大卷大皆音泰大合樂注戛擊鳴球戛古八反於豫擊石拊石於音烏圜鍾為宮注心為大辰大音泰大傀異災傀九靡反樂師有旄舞注氂牛之尾氂音來趨以采薺趨清須反大胥舍菜注直謂疏食菜羹之菜疏音蘇以序出入舞者注使出入不紕錯紕博雞反大師姑洗注而辰在大梁大音泰典同高聲䃂注杜子春讀䃂為鏗鏘之鏗鎗初耕反並同上微聲韽韽音暗注韽讀為飛鉆涅韽之韽鉆渠金反涅其兼反釋文鬼谷篇有飛鉆涅暗集韻下平聲二十五沽涅字注弇聲鬱弇於驗反釋文鍾形中央寬也集韻去聲五十五豔弇字注薄聲甄注甄猶掉也掉奴較反釋文鍾師驁夏驁五到反籥章掌土鼓豳籥注土鼓蒯桴蒯苦懷反擊土鼓以樂田畯注又有于耜舉趾饁彼南畝之事饁于法反大卜一曰玉兆二曰瓦兆三曰原兆注其象似玉瓦原之璺鏬鏬火家反又音呼坼之呼其經兆之體皆百有二十注曰蟊莫溝反掌三易之法注揲蓍變易之數揲音舌卜師辨龜之上下左右陰陽辨皮勉反華氏掌共燋契苦潔反遂吹其焌契焌祖悶反占夢以日月星辰占六夢之吉凶注入郢餘政反遂令始難依杜乃且反注以意求之儺字亦同視祲三曰鐫思隨反七曰彌注白虹彌天也虹古項反大祝掌六祈以同鬼神注祈嘄音禱三曰禬音會四曰牲號注牛曰一元大武大音泰五曰齍號注稻曰嘉疏音蘇三曰炮祭炮曰交反六曰擩祭擩而誰反並同上八曰繚祭繚音料釋文注以手從肺本循之從子容反釋文引劉沈禮殺之殺色例反釋文來瞽令皋舞皋戶報反釋文後到切呼也集韻去聲三十七號皋字注設軍社注祓社釁鼓祓音廢釋文喪祝及壙說載除飾說詩悅反注便其窆爾窆補鄧反掌勝國邑之社稷之祝號注而棧其下棧才産反一音上諫反司巫及蒩館注或為租飽租音緅又音卷大史則辟法辟芳益反注同大師抱天時注大出師則大史抱式音敕赤烏夾日夾古協反保章氏以志日月星辰之變動注月有盈虧朓側匿之變匿吐則反並同上巾車建大旗以賓方刃反釋文引劉沈重翟錫面朱總注故書朱總為䌆音廢釋文戚引昌宗安車雕面鷖總鷖烏計反釋文一計切青黑色也集韻去聲十二薺鷖字注注總車衡輨音管一音胡瞎反釋文皆有容蓋注謂蔽也蔽音弗下及注並同一音必世反釋文翟車貝面組總有握音屋木車蒲蔽注謂裸蘭車裸音果並同上注以犬皮為覆笭音泠釋文犬𧜀尾櫜姑道反釋文苦老切韜也集韻去聲三十二皓櫜字注司常置旗弊之弊薄計反釋文凡以神仕者以禬國之凶荒禬戶外反同上
