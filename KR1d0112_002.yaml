body:
  text: 卷下夏官司馬環人環戶串反釋文挈壺氏挈苦結反一音結又戶結反掌畜許六反趣馬趣清須反注同牧師牧音茂並同上大司馬以九伐之法正邦國伐扶發反釋文辨鼓鐸鐲鐃之用辨方免反釋文火弊薄計反遂以獮田注獮殺也殺色界反群吏聽誓于陳前注司徒搢朴搢如字又音箭一音初洽反甘誓湯誓之屬甘胡甘反摝鐸注如涿鹿之鹿涿音獨鼙聲不過闒湯答反車驟才遘反徒銜枚而進注枚如箸銜之有繣胡麥反或音卦致禽饁獸于郊饁于法反比軍衆比芳旨反作庀匹是也注比或為庀芳美反具也若師不功則厭而奉主車注故秦伯之敗於殽也殽音豪量人量其市朝州塗注還市朝而為道也還戶串反並同上與鬱人受斝音嫁注夏后氏以前音側産反釋文斝古雅反掌固及其衆庶注遞守固者也遞待禮反又待計反釋文凡守者守收又反注凡守者下有守者同夜三鼜以號戒注春秋傳所謂賓將趣者趣祖侯反候人注何戈與袾睹律反環人掌致師注左射以菆子侯反搏諜賊搏音付降圍邑注齊人降鄣諸讓反挈壺氏挈畚以令糧注亦縣畚于所當稟假之處稟芳鴆反射人以射法治射儀注謂肆之也肆餘二反一音四三獲胡伯反土以三耦射犴侯犴音鴈注同則以貍步張三侯注貍善搏者也搏音付與大史數射中注釋弓去撲方遘反祭祀則贊射牲注今立秋有貙劉云貙力朱反一音如字作大夫介古拜反注及下同乘王之倅車倅倉愛反服不氏而教擾之擾音饒則抗皮抗公郎反而待獲注射者中居令反射鳥氏以弓矢歐烏鳶注烏鳶喜鈔盜便汙人便符絹反並同上掌畜共祭鳥祭音卵釋文卵劉本作祭音卵司士王族故士注晚退留宿衛者宿息就反釋文膳其摯注王食其所執羔鴈之摯食音嗣凡士有守者守收又反下皆同並同上虎賁氏賁方問反釋文有勇力也集韻去聲二十二向賁字注旅賁氏夾王車夾古協反後倣此釋文大僕令聞鼓聲聞音問則自左馭而前驅注辟王也辟符亦反窆亦如之注禮記謂之封皆逋鄧反御僕大喪持翣注夾蜃車蜃薄忍反隸僕掌五寢之掃除糞灑之事除直庶反灑霜寄反王行洗乘石乘常蒸反釋文讀乘若承顏氏家訓音辭篇辨師延紐注廣袤以冠縰霜綺反釋文五采繅十有二就注所謂邃延也邃詩遂反王之皮辨會古外反五采玉璂注璂讀如薄借綦之綦薄芳惡反辨絰注其辟積如冕繅之就辟博歷反下同司兵廞五兵注有甲胄干笮丑伯反司弓矢而掌其守藏守于又反以授射甲革椹質者注蹲甲而射之蹲才官反夾弓庾弓夾古協反利攻守攻音貢枉矢潔矢潔苦結反又音結一音戶結反弩矢也殺矢鍭矢鍭音侯弩矢矰矢茀矢茀扶弗反恆矢痺矢用諸散射注前後訂其行平也訂當定反并夾注矢籋也籋奴輒反又女十反繕人抉拾注拾謂韝扞也韝彄字之異者若擇棘擇音澤戎右傳王命于陳中陳直吝反盟則以玉敦辟盟敦都愛反齊右王乘繩證反大馭右祭兩軹注故書軹為軒音雞戎僕掌王倅車之政倅倉愛反齊僕掌馭金路以賓方刃反並同上挍人皂一趣馬趣清須反釋文引劉沈六廄成注騋牝三千牝扶忍反釋文執駒注三歲曰駣音道毛馬而頒之毛莫報反執撲而從之撲方溝反牧師中春通淫注乃合纍牛騰馬纍音類庾人七尺以上為騋注玄駒裊驂裊音繞職方氏七閩注閩芉蠻矣芉音羊鳴近米其澤藪曰雲瞢亡鳳反其浸潁湛音沈其山鎮曰華山注華山在華陰華胡化反其浸波溠昨雖反與音大不同故今從高貴公其畜宜六擾音饒釋文引徐劉其浸沂沭注沭出東莞音灌其澤藪曰大野音與其澤藪曰弦蒲注在汧苦見反其澤藪曰昭餘祁注在塢烏古反形方氏無有華離之地注華讀為𠇗哨之𠇗哨羊售反山師掌山林之名辨其物注若岱畎絲枲畎孤茗反又孤善反與其利害注害毒物及螫噬之蟲獸螫呼洛反川師掌川澤之名辨其物注淮夷蠙珠暨魚蠙扶忍反撢人掌誦王志道國之政事注諭説諸侯説尸鋭反秋官司寇第五司約於妙反一音如字注同注言語之約束詩樹反一音如字雍氏雍如字注同司烜氏注故書燬為垣音袁穴土注搏蟄獸所藏者搏音付赤犮氏犮房末反注猶言捇拔也拔房末反或蒲八反蟈氏蟈音國注讀蟈為蜮音或一音古獲反今御食蛙也蛙斛佳反並同上環人環戶串反釋文胡慣切集韻去聲三十諫環字注大司寇上命糾守音狩注同釋文上願糾暴願音原釋文愚袁切愨慎也集韻上平聲二十二元願字注以圜土聚教罷民注民不愍作勞愍亡覲反釋文以嘉石平罷民注文石也文音問以邦成弊之弊芳滅反又音卑設反並同上及納亨普孟反注同下納亨放此釋文煮也集韻去聲四十三映亨字注小司寇凡命夫命婦不躬坐獄訟注針嚴子為坐嚴音莊左傳作莊案漢書明帝名莊改為嚴釋文五曰目聽注觀其眸無不反大賓客前王而辟符亦反一音匹亦反士師掌國之五禁注其粗可言者粗音粗以比追胥之事追張類反胥思敘反注謂司搏盜賊也搏音撲七曰為邦朋注故書朋作傰音崩凡刉珥刉音奇鄉士夾道而蹕夾古協反方士司寇聽其成于朝注爭鄐敕六反或音勗朝士趨旦辟趨清欲反小者庶民私之注未亂測吝反期外不聽注不得乞鞫已目反令以國法行之注以國服之法出之出敕類反又如字司刑刖罪五百注周改臏為刖臏符人反司剌三赦曰蠢愚憃癡用反司約小約劑書於丹圖注斐豹隸也斐方持反司盟盟萬民之犯命者注臧紇胡沒反職金于守藏之府守音狩凡國有大故而用金石注作槍雷椎椁之屬雷音誄椎椁皆如字犬人凡幾珥沈辜用駹可也注幾讀為吱居綺反以罷辜祭四方罷孚逼反司圜弗使冠飾注著墨幪莫貢反掌囚上罪梏拲而桎拲三家薑奉反一家居辱反罪隸掌使令之小事使色吏反牛助為牽倣注以牛助轉徙也轉張戀反貉隸而教擾之注又不生乳於圈檻也生色敬反野廬氏凡道路之舟車轚互者注車有轘轅坻閣坻都禮反雍氏春令為阱擭溝瀆之利於民者注擭柞鄂也柞才伯反鄂五格反秋令塞阱杜擭注征䣄戎䣄音徐並同上禁山之為苑於願反釋文紆願切所以養禽獸也集韻去聲二十五願苑字注司烜氏邦若屋誅注屋讀如其刑剭之剭音握釋文條狼氏掌執鞭以趨辟薄易反誓大夫曰敢不關鞭五百注莫不復請上音服下音情修閭氏掌比國中宿互柝者宿息就反並同上而比其追胥者追張類反釋文追萃切遂也集韻去聲六至追字注冥氏掌設弧張注罿罦之屬罿上凶反釋文庶氏以攻説禬之嘉草禬音潰戶內反剃氏冬日至而耜之注以耜側凍土剗之剗則展反並同上硩蔟氏十有二月之號注月謂從娵至荼娵子須反釋文引徐劉荼音餘同上引劉沈翦氏掌除蠹物注故書蠹為櫜古毛反釋文以攻禜攻音貢赤犮氏以灰灑毒之灑霜寄反除其貍蟲貍莫拜反注蟅肌蛷之屬蛷音俱壺涿氏則以牡橭午貫象齒而沈之橭音沽杜讀為枯亦音枯庭氏若神也注嘻嘻詘詘音出大行人時會以發四方之禁注謂九伐之法伐扶發反並同上其貢服物注玄纁絺纊也絺豬履反釋文纊古曠反同上引徐劉綿也集韻去聲四十二宕纊字注屬象胥諭言語協辭命屬章朿反釋文引徐劉賓而見之賓應言擯小行人職同釋文小行人王用瑱圭瑱吐電反司儀宮旁一門注所謂為壇壝宮也壝欲鬼反並同上王燕則諸侯耄音毛釋文侯毛劉本作耄告辟薄歷反釋文行夫居於其國則掌行人之勞辱事焉使則介之焉音夷掌客四十簠注西夾東夾各二也夾古協反下同秉有五籔色縷反車三秅注讀為秅秭麻答之秅秭祖禮反不受饗食受牲禮注有喪不忍煎亨煎子箋反亨普孟反並同上冬官考工記第六秦無廬注竹攢柲音筆釋文夫人而能為鏄也注多草薉穢字之異者同上爍金以為刃爍音余灼反義當作鑠始灼反釋文引徐劉合此四者合音閣釋文觀鵅不踰濟鸛音權釋文引徐劉公羊刮摩之工五注刮作捖音刮釋文搏埴之工二搏音摶築冶鳧栗段桃段徒亂反函鮑韗韋裘韗音運本或作韗同注鮑讀為鮑魚之鮑書或作鞄音僕既建而迆注皆插車輢於寄反車傍也一音起寄反並同上欲其朴屬而微至朴音僕一音扶祿反釋文屬將六反同上引戚徐劉則於馬終古登陀也陀堂何反注已大也大他餓反輪人牙也者注謂輪輮音柔同上輪敝伏滅反釋文引徐劉欲其撇爾而纖也注殺小貌也殺色例反下同一音如字注揱讀為紛容揱參之揱上音朔下所林反謂如桑螵蛸之蛸平堯反釋文欲其幬之廉也幬音濤視其綆注綆讀為關東言餅之餅方頃反謂輪箄也箄薄歷反爪牙必正也牙音雅稹理而堅稹依司農音奠一音真則轂雖敝不藃呼報反注暴起暴步莫反一音蒲報反大而短則摯注摯讀為槷魚列反並同上五分其轂其長去一以為賢胡眄反釋文引劉李形甸切車大穿也集韻去聲三十二霰賢字注而強不足也強其尚反釋文而殺其一殺色例反注殺衰小之也衰初危反一音如字揉輻必齊注揉謂以火稿之稿古老反並同上行山者欲侔莫豆反釋文莫候切上下等也集韻去聲五十候侔字注倍其桯圍以為部廣音徑下同釋文弓鑿廣二枚注弓蓋橑也橑力報反下直二枚注其弓災音廁輿人為之較崇注較兩輢上出式者輢於既反下同去一以為轛圍注謂車輿軨立者也軨音領又音零下同棧車欲弇棧才産反弇於驗反輈人軓前十尺軓音犯注同必縊其牛縊於計反以象伐也伐扶廢反冶氏與剌注著柲直前如鐏者也鐏祖悶反並同上桃氏為之莖圍注謂劍夾人所握鐔以上也鐔音尋一音徒南反釋文引徐劉設其後注後大則於把易制把音霸釋文下士服之注裨冕搢笏而虎賁之士説劍裨音卑説詩悅反鳧氏于上之攠謂之隧攠亡奇反注隧在鼓中窐而生光窐烏車反鍾己厚則石注大厚大他賀反下同並同上栗氏其臀一寸臀徒恩反釋文引徐劉函人已敝則橈注鍛革大孰大菟餓反釋文櫜之欲其約也櫜古道反鮑人之事注鮑故書或作鞄音朴欲其柔而滑也注謂親手煩撋之撋而垂反或如詢反視其著欲其淺也注謂郭韋革之札側列反欲其柔滑而腛音屋並同上引而信之信音新下皆同釋文信引革也斯人切集韻上平聲十七真信字注則是以博為帴也注謂翦者如俴淺之淺或讀為羊豬戔之戔俴仕顯反戔音普見反釋文鍾氏五入為緅祖侯反㡆氏以涗水漚其絲注故書涗作湄音眉一音奴短反去地尺暴之暴步莫反淫之以蜃注淫薄粉之令帛白粉方問反並同上玉人伯用將音陽釋文余章切雜名集韻下平聲十陽將守注天子圭中必注必讀如鹿車縪之縪謂以組約其中央縪府結反約阿駮反釋文杼上注杼閷也閷色例反殺字之異者本或作殺下取殺殺文同璧羡度尺好三寸以為度注好倍肉謂之瑗于願反黃金勺注其祈沈以馬祈居綺反並同上牙璋中璋七寸注皆有鈕牙之飾鉏側魚反釋文引劉李以為權注以為稱錘直危反釋文兩圭五寸有邸注邸謂之枑戶古反釋文柢劉作枑磬人倨句一矩有半句如字釋文已上則摩其旁注磬聲大上大他賀反已下則摩其專音穿矢人鍭矢參分茀矢參分注鍭音侯茀音殺注參訂之而平者訂當定反殺矢七分殺符弗反水之以辨其陰陽辨方免反夾其陰陽夾古協反陶人為甗魚建反並同上旊人髻墾薜暴薜薄駮反注同釋文薜弼角切器破裂也集韻入聲四覺薜字注注髻讀為明音月或五刮反一音兀又五活反釋文梓人為筍簴卻行卻去逆反注蚓衍之屬或作衍蚓衍音延今曲蟺也釋文以注鳴者注都豆反一音之樹反並同上以胸鳴者胸音鹵釋文胸劉本作胸大胸耀後耀羊肖反注耀讀為哨音與耀同釋文引劉李鋭喙決吻數目顅脰吻無憤反數音促注故書顅或作牼鄭司農云牼讀為鬜頭無髮之鬜牼苦顏反又客田反一音工定反鬜苦顏反釋文凡攫閷援簭之類閷色例反作其鱗之而注頰𩑔也𩑔古本反則必如將廢措其匪色注故書措作厝音錯七洛反又七故反梓人為侯縜寸焉縜侯犬反一音古犬反廬人句兵欲無彈句俱具反以為晉圍注晉謂矛戟下銅鐏也鐏子悶反匠人置槷注槷當為弋讀為杙音子則反四旁兩夾窗夾古協反門堂三之一注門側之堂謂之孰音育度九尺之筵度直路反注禹卑宮室卑音婢闈門闈音暉環塗七軌環戶串反廣尺深尺謂之𤰕注𤰕畎也畎古善反梢溝梢音蕭其閷參分去一閷色例反注下同葺屋參分葺音集又子入反囷窖古孝反依字當為窖作窖假借也並同上車人半矩謂之宣注頭髮皓落曰宣皓音灰釋文集韻上平聲十五灰皓字注引云髮皓落也為耒音誄或良水反釋文行澤者反輮音柔鬲長六尺鬲音隔弓人檍次之檍烏克反災栗不迆災音廁栗音烈秋閷者厚閷色例反下同老牛之角紾而昔紾徒展反並同上凡昵之類注昵或作嚏音刃釋文引劉沈欲小簡而長注簡讀為撊然登陴之撊陴蒲佳反又房卑反釋文而春液角注液讀為醳音釋下同釋文引劉沈液施集切漬也集韻入聲二十二昔液字注厚其帤注帤讀為襦有衣絮之絮襦音須釋文辟如終紲注竹䪐緄縢緄古魂反同上嬌幹欲孰於火而無羸嬌枯老反釋文告浩切以火曲物也集韻上聲三十二皓嬌字注而薄其敝博壻反釋文下柎之弓未應將興注弓柎卑音婢必動於閷色例反注及下同維角䟫之欲宛而無負弦注辟戾也辟必亦反有三均注以繩緩擐之擐郭犬反謂之夾庾之屬夾古叶反謂之句弓句九具反並同上
